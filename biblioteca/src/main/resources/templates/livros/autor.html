<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Autores</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<nav>
    <ul>
      <li><a th:href="@{/livros}">Livros</a></li>
      <li><a th:href="@{/categoria}">Categorias</a></li>
      <li><a th:href="@{/autor}">Autores</a></li>
      <li><a th:href="@{/usuario}">Usuarios</a></li>
      <li><a th:href="@{/emprestimo}">Empréstimos</a></li>
    </ul>
</nav>


<h1>Autores</h1>

<form th:action="@{/autor/criar}" method="post">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" required>

  <label for="nacionalidade">Nacionalidade</label>
  <input id="nacionalidade" name="nacionalidade" required>

  <label for="dataNascimento">Data de nascimento</label>
  <input id="dataNascimento" name="dataNascimento" required>

  <button type="submit">Criar autor</button>
</form>

<section>
  <h2>Autores cadastrados</h2>
  <p th:if="${#lists.isEmpty(autores)}">Nenhum autor cadastrado.</p>
  <article th:each="autor : ${autores}">
    <h3 th:text="${autor.nome}">Nome</h3>
    <p th:text="${autor.nacionalidade}">Nacionalidade</p>
    <p th:text="${autor.dataNascimento}">Data</p>
  </article>
</section>

</body>
</html>
