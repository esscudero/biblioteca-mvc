<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <ul>
        <li><a th:href="@{/livros}">Livros</a></li>
        <li><a th:href="@{/categoria}">Categorias</a></li>
        <li><a th:href="@{/autor}">Autores</a></li>
        <li><a th:href="@{/usuario}">Usuarios</a></li>
        <li><a th:href="@{/emprestimo}">Emprestimos</a></li>
    </ul>
</nav>
<h1 th:text="'Sistema de Biblioteca'">
</h1>

<form th:action="@{/livros/criar}" method="post">
    <label for="titulo">Título</label>
    <input id="titulo" name="titulo" type="text" required>

    <label for="autor">Autor</label>
    <input id="autor" name="autor" type="text" required>

    <label for="isbn">Isbn</label>
    <input id="isbn" name="isbn" type="text" required>

    <button type="submit">Criar livro</button>
</form>

<section class="recomendados">
    <h2>Livros Cadastrados</h2>
    <article th:each="livro : ${livros}">
        <h3 th:text="${livro.titulo}"></h3>
        <p th:text="${livro.autor}"></p>
        <p th:text="${livro.isbn}"></p>
    </article>

</section>
</body>
</html>
