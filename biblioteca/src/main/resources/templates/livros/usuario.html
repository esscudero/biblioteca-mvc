<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Usuários</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<nav>
    <ul>
      <li><a th:href="@{/livros}">Livros</a></li>
      <li><a th:href="@{/categoria}">Categorias</a></li>
      <li><a th:href="@{/autor}">Autores</a></li>
      <li><a th:href="@{/usuario}">Usuarios</a></li>
      <li><a th:href="@{/emprestimo}">Empréstimos</a></li>
    </ul>
</nav>

<h1>Usuários</h1>

<form th:action="@{/usuario/criar}" method="post">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" required>

  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" required>

  <button type="submit">Criar usuário</button>
</form>

<section>
  <h2>Usuários cadastrados</h2>
  <p th:if="${#lists.isEmpty(usuarios)}">Nenhum usuário cadastrado.</p>
  <article th:each="usuario : ${usuarios}">
    <h3 th:text="${usuario.nome}">Nome</h3>
    <p th:text="${usuario.email}">E-mail</p>
  </article>
</section>
</body>
</html>
