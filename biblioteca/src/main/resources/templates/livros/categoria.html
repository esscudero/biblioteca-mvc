<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Categorias</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<nav>
  <ul>
    <li><a th:href="@{/livros}">Livros</a></li>
    <li><a th:href="@{/categoria}">Categorias</a></li>
    <li><a th:href="@{/autor}">Autores</a></li>
    <li><a th:href="@{/usuario}">Usuarios</a></li>
    <li><a th:href="@{/emprestimo}">Empréstimos</a></li>
  </ul>
</nav>

<h1>Categorias</h1>

<form th:action="@{/categoria/criar}" method="post">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" required>

  <label for="descricao">Descrição</label>
  <input id="descricao" name="descricao" required>

  <label for="codigo">Código</label>
  <input id="codigo" name="codigo" required>

  <button type="submit">Criar categoria</button>

</form>
<section>
  <h2>Categorias cadastradas</h2>
  <p th:if="${#lists.isEmpty(categorias)}">Nenhuma categoria cadastrada.</p>
  <article th:each="categoria : ${categorias}">
    <h3 th:text="${categoria.nome}">Nome</h3>
    <p th:text="${categoria.descricao}">Descrição</p>
    <p th:text="${categoria.codigo}">Código</p>
  </article>
</section>
</body>
</html>
